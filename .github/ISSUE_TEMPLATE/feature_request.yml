name: 功能建议
description: 提出一个新功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个建议想解决什么问题？在什么场景下会遇到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选：你试过或考虑过的其他做法。
    validations:
      required: false
