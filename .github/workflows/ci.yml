name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify committed dist is up to date
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ 与源码不一致。请本地运行 'npm run build' 并提交产物。"
            exit 1
          fi

      # 发行包必须带第三方许可与版权声明；该文件依实际打包产物生成，
      # 依赖升级后若未重新生成，平台收到的声明就会过期。
      - name: Verify third-party notices are up to date
        run: |
          npm run notices
          if ! git diff --exit-code -- THIRD-PARTY-NOTICES.md; then
            echo "::error::THIRD-PARTY-NOTICES.md 与当前依赖不一致。请运行 'npm run notices' 并提交。"
            exit 1
          fi

      - name: Require a browser for E2E
        shell: bash
        run: |
          browser_path=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if browser_path="$(command -v "$candidate")" && [ -x "$browser_path" ]; then
              break
            fi
          done
          if [ -z "$browser_path" ] || [ ! -x "$browser_path" ]; then
            echo "::error::CI 必须提供可用 Chrome/Chromium，浏览器 E2E 不允许跳过。"
            exit 1
          fi
          "$browser_path" --version
          echo "TIANSHU_CANVAS_BROWSER=$browser_path" >> "$GITHUB_ENV"
          echo "TIANSHU_CANVAS_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Verify codegen compiles (adapter stubs)
        run: npm run verify:codegen

      - name: Plugin release self-check
        run: npm run check:plugin
